<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTJV AI-CCTV | Secure Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d14] text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-md bg-[#101724]/95 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-teal-500/15 border border-teal-500/35 flex items-center justify-center text-teal-400 font-bold">
        PTJV
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-wide text-white">Matarbari Port AI-CCTV</h1>
        <p class="text-xs text-slate-400">Edge PPE Inference & Safety Command</p>
      </div>
    </div>

    {% if error %}
    <div class="mb-4 px-3 py-2.5 rounded-lg bg-red-500/15 border border-red-500/40 text-red-300 text-xs font-medium">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
        <input type="text" name="username" required autofocus
          class="w-full px-3.5 py-2.5 rounded-lg bg-[#090d14] border border-slate-700 text-sm text-white focus:outline-none focus:border-teal-500"
          placeholder="Enter registered username" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" name="password" required
          class="w-full px-3.5 py-2.5 rounded-lg bg-[#090d14] border border-slate-700 text-sm text-white focus:outline-none focus:border-teal-500"
          placeholder="••••••••" />
      </div>
      <button type="submit"
        class="w-full py-2.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white font-bold text-sm tracking-wide transition cursor-pointer">
        SIGN IN
      </button>
    </form>
  </div>
</body>
</html>
